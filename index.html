<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hack-n-Slash — Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d18;color:#eee;font-family:system-ui,sans-serif;touch-action:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#32223f,#100d18 70%)}
#game{height:min(100dvh,177.78vw);width:min(100vw,56.25dvh);aspect-ratio:9/16;position:relative;overflow:hidden;background:linear-gradient(#1a1526 0%,#2b1e37 55%,#17121f 100%);border:1px solid #584568}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:12px;color:#d9cce4;z-index:2}
#arena{position:absolute;inset:0}
#floor{position:absolute;bottom:12%;height:5px;width:100%;background:#6f536f;box-shadow:0 8px 0 #17121f}
#moon{position:absolute;top:11%;right:12%;width:52px;height:52px;border-radius:50%;background:#c5afcf;opacity:.6;box-shadow:0 0 32px #9b77b6}
#hero{position:absolute;width:54px;height:86px;bottom:calc(12% + 5px);left:calc(50% - 27px);image-rendering:pixelated;transition:filter .08s}
#hero .hood{position:absolute;top:0;left:13px;width:29px;height:28px;background:#17131e;border:4px solid #79638a;clip-path:polygon(20% 0,80% 0,100% 70%,65% 100%,20% 90%,0 35%)}
#hero .face{position:absolute;top:14px;left:23px;width:13px;height:8px;background:#c9a9c7}
#hero .body{position:absolute;top:27px;left:10px;width:34px;height:34px;background:#24202f;border:3px solid #655075;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
#hero .sash{position:absolute;top:28px;left:25px;width:7px;height:33px;background:#873c73;transform:rotate(12deg)}
#hero .skirt{position:absolute;top:55px;left:5px;width:44px;height:23px;background:#292131;border:3px solid #66506f;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
#hero .leg{position:absolute;top:75px;width:12px;height:11px;background:#17131e;border-bottom:3px solid #a28aaa}
#hero .leg.l{left:13px}#hero .leg.r{right:12px}
#hero .blade{position:absolute;top:36px;right:-7px;width:5px;height:36px;background:#d6cbdc;transform:rotate(-30deg);transform-origin:top}
#hero.attack .blade{height:53px;transform:rotate(-95deg);filter:drop-shadow(0 0 4px #c7a3df)}
#hero.hit1{transform:translateX(7px)}#hero.hit2{transform:translateX(13px) scale(1.03)}#hero.hit3{transform:translateX(18px) scale(1.05)}
#hero.jump{bottom:calc(25% + 5px)}
#enemy{position:absolute;width:38px;height:58px;bottom:calc(12% + 5px);left:70%;background:#4b2739;border:3px solid #85516b;clip-path:polygon(25% 0,75% 0,100% 30%,85% 100%,15% 100%,0 30%)}
#enemy:before{content:"";position:absolute;top:17px;left:8px;width:16px;height:4px;background:#e3b5c8}
#enemy.down{opacity:.25;transform:rotate(80deg);transform-origin:bottom}
#hint{position:absolute;bottom:22%;left:0;right:0;text-align:center;font-size:11px;color:#bcaac9;pointer-events:none}
#controls{position:absolute;bottom:3%;left:4%;right:4%;display:flex;justify-content:space-between;align-items:end;z-index:3}
.group{display:flex;gap:8px}.ctrl{width:52px;height:52px;border-radius:15px;border:1px solid #8d759c;background:#251d30d9;color:#f1e8f7;font-weight:700;font-size:18px;box-shadow:0 4px 0 #100d18;user-select:none}.ctrl:active{background:#684879;transform:translateY(2px)}.ctrl.small{font-size:11px;width:58px}
#status{position:absolute;top:42px;left:12px;font-size:11px;color:#e0cce8}
</style></head>
<body><div id="wrap"><main id="game" aria-label="Game Hack-n-Slash prototype">
<div id="arena"><div id="moon"></div><div id="top"><b>HACK-N-SLASH</b><span>PROTOTIPE 0.1</span></div><div id="status">HP ♥ ♥ ♥ &nbsp; | &nbsp; Combo: <span id="combo">0</span></div>
<div id="hero"><div class="hood"></div><div class="face"></div><div class="body"></div><div class="sash"></div><div class="skirt"></div><div class="leg l"></div><div class="leg r"></div><div class="blade"></div></div><div id="enemy"></div><div id="floor"></div><div id="hint">Kalahkan musuh latihan untuk mencoba serangan dasar</div></div>
<div id="controls"><div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div class="group"><button class="ctrl small" id="jump">LOMPAT</button><button class="ctrl" id="attack">⚔</button></div></div>
</main></div>
<script>
const hero=document.querySelector('#hero'),enemy=document.querySelector('#enemy'),game=document.querySelector('#game'),comboEl=document.querySelector('#combo');
let x=50,jumping=false,combo=0,enemyHp=3,attackTimer=null,keys={};
function place(){hero.style.left='calc('+x+'% - 27px)'}
function move(d){x=Math.max(7,Math.min(93,x+d*3.5));place()}
function jump(){if(jumping)return;jumping=true;hero.classList.add('jump');setTimeout(()=>{hero.classList.remove('jump');jumping=false},500)}
function attack(){if(attackTimer)return;combo=combo%3+1;comboEl.textContent=combo;hero.classList.add('attack','hit'+combo);let hit=Math.abs(x-70)<24;if(hit){enemyHp--;enemy.style.filter='brightness(2)';setTimeout(()=>enemy.style.filter='',100);if(enemyHp<=0){enemy.classList.add('down');document.querySelector('#hint').textContent='Musuh latihan tumbang!';setTimeout(()=>{enemyHp=3;enemy.classList.remove('down');document.querySelector('#hint').textContent='Kalahkan musuh latihan untuk mencoba serangan dasar'},1800)}}attackTimer=setTimeout(()=>{hero.classList.remove('attack','hit1','hit2','hit3');attackTimer=null},230)}
[['left',()=>move(-1)],['right',()=>move(1)],['jump',jump],['attack',attack]].forEach(([id,fn])=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn()})});
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key===' '||e.key==='ArrowUp')jump();if(e.key==='j'||e.key==='Enter')attack()});
place();
</script></body></html>
