<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" shape-rendering="crispEdges">
<defs>
 <g id="body">
  <!-- shadow -->
  <rect x="8" y="59" width="32" height="3" fill="#090710" opacity=".75"/>
  <!-- hair silhouette -->
  <rect x="15" y="4" width="18" height="5" fill="#100d19"/><rect x="12" y="8" width="24" height="13" fill="#171222"/><rect x="10" y="17" width="7" height="24" fill="#171222"/><rect x="31" y="17" width="7" height="28" fill="#171222"/><rect x="13" y="38" width="5" height="10" fill="#171222"/><rect x="31" y="40" width="5" height="9" fill="#171222"/>
  <!-- hood/crown -->
  <rect x="16" y="3" width="16" height="3" fill="#51405e"/><rect x="19" y="1" width="10" height="3" fill="#76608a"/><rect x="22" y="4" width="4" height="4" fill="#c8c1d2"/><rect x="23" y="5" width="2" height="2" fill="#f2e8ff"/>
  <!-- face -->
  <rect x="17" y="10" width="14" height="12" fill="#d8b3a7"/><rect x="15" y="10" width="3" height="9" fill="#171222"/><rect x="30" y="10" width="3" height="9" fill="#171222"/><rect x="19" y="15" width="4" height="2" fill="#27182f"/><rect x="26" y="15" width="4" height="2" fill="#27182f"/>
  <!-- bangs -->
  <rect x="17" y="8" width="15" height="4" fill="#100d19"/><rect x="18" y="11" width="3" height="5" fill="#100d19"/><rect x="24" y="10" width="3" height="6" fill="#100d19"/><rect x="29" y="11" width="3" height="4" fill="#100d19"/>
  <!-- neck -->
  <rect x="21" y="21" width="7" height="4" fill="#b88c8d"/>
  <!-- dress shoulders and torso -->
  <rect x="14" y="24" width="20" height="8" fill="#32223f"/><rect x="17" y="23" width="14" height="4" fill="#51405e"/><rect x="20" y="25" width="8" height="15" fill="#1b1427"/><rect x="22" y="27" width="4" height="9" fill="#7c4d88"/><rect x="23" y="28" width="2" height="5" fill="#c8c1d2"/>
  <!-- arms -->
  <rect x="10" y="25" width="5" height="13" fill="#171222"/><rect x="8" y="34" width="7" height="5" fill="#51405e"/><rect x="33" y="25" width="5" height="13" fill="#171222"/><rect x="33" y="34" width="7" height="5" fill="#51405e"/>
  <!-- skirt -->
  <rect x="16" y="38" width="16" height="5" fill="#34213f"/><rect x="13" y="42" width="22" height="5" fill="#24172f"/><rect x="11" y="47" width="26" height="5" fill="#171222"/><rect x="9" y="52" width="30" height="5" fill="#32213f"/><rect x="12" y="54" width="5" height="3" fill="#8c5a9c"/><rect x="31" y="52" width="5" height="5" fill="#8c5a9c"/>
  <!-- boots -->
  <rect x="15" y="57" width="7" height="4" fill="#100d19"/><rect x="27" y="57" width="7" height="4" fill="#100d19"/><rect x="13" y="60" width="10" height="2" fill="#76608a"/><rect x="26" y="60" width="10" height="2" fill="#76608a"/>
  <!-- dagger -->
  <rect x="38" y="31" width="2" height="12" fill="#d5d0e1"/><rect x="36" y="40" width="6" height="2" fill="#8e7aa4"/><rect x="39" y="27" width="2" height="5" fill="#f1edf7"/>
 </g>
</defs>
<!-- idle A -->
<g transform="translate(0 0)"><use href="#body"/></g>
<!-- idle B / slight hair sway -->
<g transform="translate(48 0)"><use href="#body"/><rect x="58" y="22" width="3" height="5" fill="#171222"/><rect x="80" y="22" width="3" height="7" fill="#171222"/></g>
<!-- walk pose A -->
<g transform="translate(96 0)"><use href="#body"/><rect x="110" y="58" width="9" height="3" fill="#100d19"/><rect x="126" y="56" width="8" height="3" fill="#100d19"/></g>
<!-- walk pose B -->
<g transform="translate(144 0)"><use href="#body"/><rect x="159" y="56" width="8" height="3" fill="#100d19"/><rect x="128" y="58" width="9" height="3" fill="#100d19"/></g>
<!-- attack pose -->
<g transform="translate(192 0)"><use href="#body"/><rect x="230" y="25" width="5" height="3" fill="#d5d0e1"/><rect x="234" y="21" width="3" height="6" fill="#f1edf7"/><rect x="224" y="27" width="7" height="2" fill="#8e7aa4"/></g>
</svg>